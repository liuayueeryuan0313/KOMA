name: Build and Publish Docker Images

on:
  release:
    types: [published]
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish (leave empty for main/latest)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Multi-Arch Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'aweo' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine images to publish
        id: image-targets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            IMAGES="aweo/koma
          $IMAGES"
          fi
          echo "images<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-targets.outputs.images }}
          tags: |
            type=raw,value=latest

      - name: Record application version and image build date
        id: build-date
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'from app_version import VERSION; print(VERSION)')
          if [ -n "$RELEASE_TAG" ]; then
            [ "$RELEASE_TAG" = "v$VERSION" ] || { echo 'Release tag and source version do not match'; exit 1; }
          fi
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            KOMA_BUILD_DATE=${{ steps.build-date.outputs.date }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.build-date.outputs.version }}
            org.opencontainers.image.created=${{ steps.build-date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Publish architecture-specific version tags
        env:
          IMAGES: ${{ steps.image-targets.outputs.images }}
          VERSION: ${{ steps.build-date.outputs.version }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r IMAGE; do
            [ -n "$IMAGE" ] || continue
            IMAGE="${IMAGE,,}"
            docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw > manifest.json
            for ARCH in amd64 arm64; do
              DIGEST=$(python3 -c 'import json,sys; m=json.load(open("manifest.json")); ds=[x["digest"] for x in m["manifests"] if x.get("platform",{}).get("os")=="linux" and x.get("platform",{}).get("architecture")==sys.argv[1]]; assert len(ds)==1, ds; print(ds[0])' "$ARCH")
              docker buildx imagetools create --prefer-index=false \
                --tag "$IMAGE:$VERSION-$ARCH" "$IMAGE@$DIGEST"
            done
          done <<< "$IMAGES"

  release-assets:
    name: Attach both offline release images
    needs: docker
    if: github.event_name == 'release'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
